<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>EMPLOYEE MANAGEMENT SYSTEM</h1>
        <p id="dateTime"></p>
        <p id="status">Loading...</p>
    </header>


    <main>

        <!-- SEARCH -->
        <section class="search-section">

            <input
                type="text"
                id="searchInput"
                placeholder="Search employee by name"
            >

            <button id="searchBtn">
                Search
            </button>

        </section>


        <!-- DEPARTMENT FILTERS -->
        <section class="filters">

            <button
                class="filter-btn active"
                data-department="All">
                All Employees
            </button>

            <button
                class="filter-btn"
                data-department="IT">
                IT
            </button>

            <button
                class="filter-btn"
                data-department="HR">
                HR
            </button>

            <button
                class="filter-btn"
                data-department="Finance">
                Finance
            </button>

            <button
                class="filter-btn"
                data-department="Marketing">
                Marketing
            </button>

        </section>


        <!-- SORT -->
        <section class="sort-section">

            <label for="sortSelect">
                Sort Employees:
            </label>

            <select id="sortSelect">

                <option value="">
                    Default
                </option>

                <option value="name-asc">
                    Name A-Z
                </option>

                <option value="name-desc">
                    Name Z-A
                </option>

                <option value="age-asc">
                    Age Low to High
                </option>

                <option value="age-desc">
                    Age High to Low
                </option>

                <option value="salary-asc">
                    Salary Low to High
                </option>

                <option value="salary-desc">
                    Salary High to Low
                </option>

            </select>

        </section>


        <!-- STATISTICS -->
        <section class="statistics">

            <div class="stat-card">
                <h3>Employee Count</h3>
                <p id="employeeCount">0</p>
            </div>

            <div class="stat-card">
                <h3>Total Salary</h3>
                <p id="totalSalary">₹0</p>
            </div>

            <div class="stat-card">
                <h3>Average Salary</h3>
                <p id="averageSalary">₹0</p>
            </div>

            <div class="stat-card">
                <h3>Highest Salary</h3>
                <p id="highestSalary">--</p>
            </div>

        </section>


        <!-- RESULT -->
        <section class="results">

            <h2>Employees</h2>

            <p id="resultText">
                0 employees shown
            </p>

            <p id="emptyMessage" class="hidden">
                No employees found.
            </p>

            <div id="employeeList" class="employee-list">
            </div>

        </section>


        <!-- ADD EMPLOYEE -->
        <section class="form-section">

            <h2>ADD EMPLOYEE</h2>

            <form id="employeeForm">

                <!-- NAME -->
                <label for="name">
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter employee name"
                >

                <small id="nameError"></small>


                <!-- AGE -->
                <label for="age">
                    Age
                </label>

                <input
                    type="number"
                    id="age"
                    placeholder="Enter age"
                >

                <small id="ageError"></small>


                <!-- EMAIL -->
                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter email"
                >

                <small id="emailError"></small>


                <!-- DEPARTMENT -->
                <label for="department">
                    Department
                </label>

                <select id="department">

                    <option value="">
                        Select Department
                    </option>

                    <option value="IT">
                        IT
                    </option>

                    <option value="HR">
                        HR
                    </option>

                    <option value="Finance">
                        Finance
                    </option>

                    <option value="Marketing">
                        Marketing
                    </option>

                </select>

                <small id="departmentError"></small>


                <!-- PHONE -->
                <label for="phone">
                    Phone
                </label>

                <input
                    type="text"
                    id="phone"
                    placeholder="Enter phone number"
                >


                <!-- SALARY -->
                <label for="salary">
                    Salary
                </label>

                <input
                    type="number"
                    id="salary"
                    placeholder="Enter salary"
                >


                <!-- FORM MESSAGE -->
                <p id="formMessage"></p>


                <!-- SUBMIT -->
                <button type="submit">
                    Add Employee
                </button>

            </form>

        </section>

    </main>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
